        async function checkSesion() {
            const sb = obtenerSupabase();
            if (!sb) return;

            sb.auth.onAuthStateChange(async (event, session) => {
                if (session && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) {
                    user = session.user;
                    await cargarPerfil();
                    ver('vista-app');
                    subSec('dash');
                    cargarCursosDashboard();
                    iniciarVigilanteSesionUnica();
                    lanzarPopupAnuncioSiExiste();
                }
            });

            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                user = session.user;
                await cargarPerfil();
                ver('vista-app');
                subSec('dash');
                cargarCursosDashboard();
                iniciarVigilanteSesionUnica();
                lanzarPopupAnuncioSiExiste();
            } else {
                ver('vista-login');

        async function iniciarVigilanteSesionUnica() {
            const sb = obtenerSupabase();
            if (!user || !sb) return;
            tokenSesionActual = 'sess_' + Math.random().toString(36).substring(2) + Date.now();
            await sb.from('perfiles').update({ token_sesion: tokenSesionActual }).eq('id', user.id);

            setInterval(async () => {
                if (!user) return;
                const { data } = await sb.from('perfiles').select('token_sesion').eq('id', user.id).single();
                if (data && data.token_sesion && data.token_sesion !== tokenSesionActual) {
                    await sb.auth.signOut();
                    user = null;
                    mostrarAvisoModal("Sesión Cerrada", "Tu cuenta se ha abierto en otro dispositivo.", "⚠️");
                    ver('vista-login');
                }
            }, 20000);
        }

        document.getElementById('f-reg').addEventListener('submit', async (e) => {
            e.preventDefault();
            const sb = obtenerSupabase();
            const btn = document.getElementById('btn-reg');
            const msg = document.getElementById('msg-reg');
            msg.style.display = 'none';

            const nombres = document.getElementById('r-nom').value.trim();
            const apellidos = document.getElementById('r-ape').value.trim();
            const carrera = document.getElementById('r-carrera').value;
            const prefijo = document.getElementById('r-prefijo').value;
            const dni = document.getElementById('r-dni').value.trim();
            const fechaNac = document.getElementById('r-nac').value;
            const email = document.getElementById('r-email').value.trim();
            const pass = document.getElementById('r-pass').value;

            if (pass.length < 8) {
                msg.innerText = 'La contraseña debe tener al menos 8 caracteres.';
                msg.className = 'alerta alerta-err'; msg.style.display = 'block';
                return;
            }

            let edadCalculada = 25;
            if (fechaNac) {
                const nac = new Date(fechaNac);
                const hoy = new Date();
                edadCalculada = hoy.getFullYear() - nac.getFullYear();
            }

            btn.disabled = true; btn.innerText = 'Creando cuenta...';

            try {
                const { data: auth, error: aErr } = await sb.auth.signUp({ email, password: pass });
                if (aErr) throw aErr;

                if (auth && auth.user) {
                    await sb.from('perfiles').insert([{
                        id: auth.user.id, nombres, apellidos, carrera, prefijo_trato: prefijo,
                        dni, fecha_nacimiento: fechaNac, edad: edadCalculada, correo: email,
                        rol: 'estudiante', plan: 'gratuito', estado: 'activo', preguntas_hoy: 0
                    }]);
                    await sb.from('perfil_mascota').insert([{ 
                        user_id: auth.user.id, animal: 'perrito', nivel: 1, accesorio_cabeza: 'ninguno', accesorio_cuerpo: 'ninguno'
                    }]);
                }

                msg.innerText = '¡Registro completado! Ya puedes iniciar sesión.';
                msg.className = 'alerta alerta-ok'; msg.style.display = 'block';
                document.getElementById('f-reg').reset();

        function generarSVGMarkup(ancho = 90, animar = true) {
            const animal = perfilMascota.animal || 'perrito';
            const cabeza = perfilMascota.cabeza || 'ninguno';
            const cuerpo = perfilMascota.cuerpo || 'ninguno';
            const nivel = perfilMascota.nivel || 1;

            let escalaEvolucion = 1;
            let esBebe = false;
            let esAdultoFuerte = false;

            if (nivel < 4) { escalaEvolucion = 0.88; esBebe = true; }
            else if (nivel >= 8) { escalaEvolucion = 1.08; esAdultoFuerte = true; }

            let colorBase = "#f2a65a";
            let colorOrejas = "#c87834";
            let colorHocico = "#fbe6cf";

            if (animal === 'gatito') { colorBase = "#a0a8b4"; colorOrejas = "#ffb6c1"; colorHocico = "#ffffff"; }
            else if (animal === 'panda') { colorBase = "#ffffff"; colorOrejas = "#2c3e50"; colorHocico = "#ffffff"; }
            else if (animal === 'zorrito') { colorBase = "#e65c00"; colorOrejas = "#3d1e03"; colorHocico = "#ffffff"; }
            else if (animal === 'fenix') { colorBase = "#ff4500"; colorOrejas = "#ffd700"; colorHocico = "#ffa500"; }
            else if (animal === 'polar') { colorBase = "#f8f9fa"; colorOrejas = "#dee2e6"; colorHocico = "#ffffff"; }
            else if (animal === 'grizzly') { colorBase = "#6f4e37"; colorOrejas = "#4b3524"; colorHocico = "#a07855"; }

            let svgCuerpoRopa = `
                <ellipse cx="50" cy="${esBebe ? '70' : '68'}" rx="${esAdultoFuerte ? '32' : '28'}" ry="${esAdultoFuerte ? '26' : '24'}" fill="${colorBase}"/>
                <ellipse cx="50" cy="70" rx="${esAdultoFuerte ? '18' : '16'}" ry="15" fill="${colorHocico}"/>
            `;
            if (cuerpo === 'mandil') {
                svgCuerpoRopa += `<path d="M26 62 Q50 56 74 62 L70 88 Q50 92 30 88 Z" fill="#ffffff" stroke="#ced4da" stroke-width="1.5"/><circle cx="50" cy="72" r="1.5" fill="#0056b3"/>`;
            } else if (cuerpo === 'scrub') {
                svgCuerpoRopa += `<path d="M26 62 Q50 56 74 62 L70 88 Q50 92 30 88 Z" fill="#007bff"/><path d="M42 60 L50 70 L58 60" fill="none" stroke="#004494" stroke-width="2"/>`;
            } else if (cuerpo === 'chaleco') {
                svgCuerpoRopa += `<path d="M26 62 Q50 56 74 62 L70 88 Q50 92 30 88 Z" fill="#d9381e"/><rect x="28" y="74" width="44" height="4" fill="#ffd700"/>`;
            }

            svgCuerpoRopa += `
                <ellipse cx="36" cy="88" rx="${esAdultoFuerte ? '9' : '8'}" ry="6" fill="${colorBase}"/>
                <ellipse cx="64" cy="88" rx="${esAdultoFuerte ? '9' : '8'}" ry="6" fill="${colorBase}"/>
            `;

            let svgOrejas = "";
            if (animal === 'gatito') {
                svgOrejas = `<polygon points="26,30 34,10 44,26" fill="${colorOrejas}"/><polygon points="74,30 66,10 56,26" fill="${colorOrejas}"/>`;
            } else if (animal === 'zorrito') {
                svgOrejas = `<polygon points="22,32 30,6 44,24" fill="${colorOrejas}"/><polygon points="78,32 70,6 56,24" fill="${colorOrejas}"/>`;
            } else if (animal === 'panda' || animal === 'polar' || animal === 'grizzly') {
                svgOrejas = `<circle cx="28" cy="18" r="${esBebe ? '13' : '11'}" fill="${colorOrejas}"/><circle cx="72" cy="18" r="${esBebe ? '13' : '11'}" fill="${colorOrejas}"/>`;
            } else if (animal === 'fenix') {
                svgOrejas = `<path d="M12 55 Q-4 28 22 30 Q12 42 30 48 Z" fill="#ff4500"/><path d="M88 55 Q104 28 78 30 Q88 42 70 48 Z" fill="#ff4500"/><polygon points="50,8 45,22 55,22" fill="#ffd700"/>`;
            } else {
                svgOrejas = `<ellipse cx="23" cy="38" rx="8" ry="18" fill="${colorOrejas}" transform="rotate(22 23 38)"/><ellipse cx="77" cy="38" rx="8" ry="18" fill="${colorOrejas}" transform="rotate(-22 77 38)"/>`;
            }

            let svgAccesoriosCabeza = "";
            if (cabeza === 'gorro') {
                svgAccesoriosCabeza = `<path d="M25 24 Q50 10 75 24 Q72 16 50 14 Q28 16 25 24 Z" fill="#28a745"/><rect x="24" y="22" width="52" height="6" rx="3" fill="#218838"/>`;
            } else if (cabeza === 'birrete') {
                svgAccesoriosCabeza = `<polygon points="50,6 80,18 50,26 20,18" fill="#2c3e50"/><rect x="36" y="22" width="28" height="6" fill="#1a252f"/><line x1="50" y1="18" x2="72" y2="28" stroke="#ffd700" stroke-width="2"/>`;
            } else if (cabeza === 'esteto') {
                svgAccesoriosCabeza = `<path d="M35 52 Q50 68 65 52" fill="none" stroke="#495057" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="64" r="4.5" fill="#ffd700"/>`;
            }

            return `
                <svg viewBox="0 0 100 100" class="svg-mascota-render" style="width: ${ancho}px; height: ${ancho}px; transform: scale(${escalaEvolucion});">
                    ${svgOrejas}
                    ${svgCuerpoRopa}
                    <ellipse cx="50" cy="40" rx="${esBebe ? '28' : '26'}" ry="${esBebe ? '24' : '22'}" fill="${colorBase}"/>
                    ${animal === 'panda' ? '<ellipse cx="39" cy="38" rx="8" ry="10" fill="#2c3e50"/><ellipse cx="61" cy="38" rx="8" ry="10" fill="#2c3e50"/>' : ''}
                    <g class="${animar ? 'anim-ojo-parpadeo' : ''}">
                        <ellipse cx="40" cy="38" rx="${esBebe ? '5' : '4'}" ry="${esBebe ? '6.5' : '5.5'}" fill="#1a252f"/>
                        <circle cx="38.5" cy="36" r="${esBebe ? '2' : '1.5'}" fill="#ffffff"/>
                        <ellipse cx="60" cy="38" rx="${esBebe ? '5' : '4'}" ry="${esBebe ? '6.5' : '5.5'}" fill="#1a252f"/>
                        <circle cx="58.5" cy="36" r="${esBebe ? '2' : '1.5'}" fill="#ffffff"/>
                    </g>
                    <ellipse cx="32" cy="45" rx="4" ry="2" fill="#ff7675" fill-opacity="0.6"/>
                    <ellipse cx="68" cy="45" rx="4" ry="2" fill="#ff7675" fill-opacity="0.6"/>
                    ${animal === 'fenix' 
                        ? '<polygon points="46,42 54,42 50,51" fill="#ffd700"/>' 
                        : `<ellipse cx="50" cy="47" rx="${animal === 'zorrito' ? '7' : '10'}" ry="${animal === 'zorrito' ? '9' : '7'}" fill="${colorHocico}"/>
                           <polygon points="47,44 53,44 50,47" fill="#2c3e50"/><path d="M47 48 Q50 51 53 48" fill="none" stroke="#2c3e50" stroke-width="1.5" stroke-linecap="round"/>`
                    }
                    ${svgAccesoriosCabeza}
                </svg>
            `;
        }

        async function cargarSiguientePregunta() {
            const sb = obtenerSupabase();
            document.getElementById('sim-fb').style.display = 'none';
            document.getElementById('btn-sig').style.display = 'none';

            const esIlimitado = (perfilUsuario && perfilUsuario.plan === 'premium');
            if (!esIlimitado && perfilUsuario.preguntas_hoy >= 15) return abrirModalPremium();

            if (!esIlimitado) document.getElementById('contador-diario').innerText = `Hoy: ${perfilUsuario.preguntas_hoy}/15 preguntas`;
            else document.getElementById('contador-diario').innerText = 'Acceso Ilimitado';

            if (preguntasFalladasBuffer.length > 0) {
                preguntaActual = preguntasFalladasBuffer.shift();
                mostrarPreguntaEnPantalla(preguntaActual, "🎯 REPASANDO PREGUNTA FALLADA");
                return;
            }
            if (preguntasIaBuffer.length > 0) {
                preguntaActual = preguntasIaBuffer.shift();
                mostrarPreguntaEnPantalla(preguntaActual, "Generada con IA (SERUMS MINSA)");
                return;
            }

            const cursoNombre = document.getElementById('sel-curso-banqueo').value;
            const areaId = MAPEO_CURSOS_ID[cursoNombre] || 1;
            const { data } = await sb.from('preguntas').select('*').eq('area_id', areaId);
            
            if (!data || data.length === 0) {
                document.getElementById('sim-enunciado').innerText = 'Aún no hay preguntas en este curso en la base de datos.';
                document.getElementById('sim-opciones').innerHTML = '';
                return;
            }

            preguntaActual = data[Math.floor(Math.random() * data.length)];
            mostrarPreguntaEnPantalla(preguntaActual, `Dificultad: ${preguntaActual.dificultad || 'Intermedia'}`);
        }

        function mostrarPreguntaEnPantalla(p, subtitulo) {
            document.getElementById('sim-info').innerText = subtitulo;
            document.getElementById('sim-enunciado').innerText = p.enunciado;
            document.getElementById('sim-opciones').innerHTML = `
                <button class="btn-op" onclick="responder(this, 'A')">A) ${p.opcion_a}</button>
                <button class="btn-op" onclick="responder(this, 'B')">B) ${p.opcion_b}</button>
                <button class="btn-op" onclick="responder(this, 'C')">C) ${p.opcion_c}</button>
                <button class="btn-op" onclick="responder(this, 'D')">D) ${p.opcion_d}</button>
            `;
        }

        async function responder(btn, opt) {
            const sb = obtenerSupabase();
            document.querySelectorAll('.btn-op').forEach(b => b.disabled = true);
            const esOk = (opt === preguntaActual.respuesta_correcta);
            const fb = document.getElementById('sim-fb');

            if (esOk) {
                btn.classList.add('correcta'); fb.className = 'fb-box fb-ok';
                document.getElementById('fb-tit').innerText = '✔ ¡Respuesta Correcta!';
                if (perfilMascota && sb) {
                    const m = perfilMascota.monedas + 2; perfilMascota.monedas = m;
                    if (m % 30 === 0) {
                        perfilMascota.nivel += 1;
                        await sb.from('perfil_mascota').update({ nivel: perfilMascota.nivel }).eq('user_id', user.id);
                        mostrarAvisoModal("¡Tu Mascota Evolucionó!", `¡Felicidades! Alcanzó el Nivel ${perfilMascota.nivel}.`, "🌟");
                    }
                    document.getElementById('m-monedas').innerText = m;
                    await sb.from('perfil_mascota').update({ monedas: m }).eq('user_id', user.id);
                }
            } else {
                btn.classList.add('incorrecta'); fb.className = 'fb-box fb-err';
                document.getElementById('fb-tit').innerText = '✖ Respuesta Incorrecta';
            }

            document.getElementById('fb-txt').innerText = preguntaActual.justificacion;
            fb.style.display = 'block'; document.getElementById('btn-sig').style.display = 'block';

            const esIlimitado = (perfilUsuario && perfilUsuario.plan === 'premium');
            if (!esIlimitado && sb) {
                perfilUsuario.preguntas_hoy += 1;
                await sb.from('perfiles').update({ preguntas_hoy: perfilUsuario.preguntas_hoy }).eq('id', user.id);
            }
            if (sb && preguntaActual.id) {
                await sb.from('intentos_usuario').insert([{ user_id: user.id, pregunta_id: preguntaActual.id, area_id: preguntaActual.area_id || 1, tema_id: preguntaActual.tema_id || null, es_correcta: esOk }]);
            }
        }

        async function generarPreguntasConIA() {
            if (!perfilUsuario || perfilUsuario.plan !== 'premium') return abrirModalPremium();
            const cursoSeleccionado = document.getElementById('sel-curso-banqueo').value;
            const temaSeleccionado = document.getElementById('sel-tema-banqueo').value;
            const cantidad = Math.min(10, parseInt(document.getElementById('sel-cantidad-preguntas-ia').value) || 5);
            const dificultades = [];
            if (document.getElementById('chk-dif-basica').checked) dificultades.push("Básica");
            if (document.getElementById('chk-dif-intermedia').checked) dificultades.push("Intermedia");
            if (document.getElementById('chk-dif-avanzada').checked) dificultades.push("Avanzada");
            if (dificultades.length === 0) return mostrarAvisoModal("Dificultad", "Marca al menos un nivel.", "⚠️");

            const btn = document.getElementById('btn-generar-preguntas-ia');
            btn.innerHTML = '⏳ Diseñando con Gemini IA...'; btn.disabled = true;

            try {
                const res = await fetch('/api/generar-ia', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ curso: cursoSeleccionado, tema: temaSeleccionado, dificultades, cantidad, tipo: "preguntas" })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Fallo de IA');
                if (data.resultado && data.resultado.length > 0) {
                    preguntasIaBuffer = data.resultado.slice(0, 10);
                    cargarSiguientePregunta();
                    mostrarAvisoModal("¡Casos Listos!", `Se generaron ${preguntasIaBuffer.length} preguntas con IA.`, "🤖");
                }
            } catch (err) {
                mostrarAvisoModal("Aviso de IA", err.message, "⚠️");
            } finally {
                btn.innerHTML = '⚡ Formular con IA (Solo Premium)'; btn.disabled = false;
            }
        }

        async function cargarEstadisticas() {
            const sb = obtenerSupabase();
            if (!user || !sb) return;
            const { data } = await sb.from('intentos_usuario').select('pregunta_id, area_id, es_correcta').eq('user_id', user.id);
            if (!data || data.length === 0) {
                document.getElementById('st-total').innerText = '0';
                document.getElementById('st-ok').innerText = '0%';
                document.getElementById('txt-contador-fallos').innerText = '0';
                document.getElementById('contenedor-stats-por-curso').innerHTML = '<p style="color: #6c757d;">Aún no has respondido preguntas.</p>';
                return;
            }

            const total = data.length;
            const aciertos = data.filter(i => i.es_correcta).length;
            const fallos = data.filter(i => !i.es_correcta);
            document.getElementById('st-total').innerText = total;
            document.getElementById('st-ok').innerText = Math.round((aciertos / total) * 100) + '%';
            document.getElementById('txt-contador-fallos').innerText = fallos.length;

            const cursosInfo = [
                { id: 1, nombre: 'Salud Pública', color: '#007bff' },
                { id: 2, nombre: 'Cuidado Integral de Salud', color: '#28a745' },
                { id: 5, nombre: 'Gestión de Servicios de Salud', color: '#e83e8c' },
                { id: 4, nombre: 'Investigación', color: '#6f42c1' },
                { id: 3, nombre: 'Ética e Interculturalidad', color: '#ffc107' }
            ];

            const contCursos = document.getElementById('contenedor-stats-por-curso');
            contCursos.innerHTML = '';
            cursosInfo.forEach(c => {
                const intentosCurso = data.filter(i => i.area_id === c.id);
                const totC = intentosCurso.length;
                const okC = intentosCurso.filter(i => i.es_correcta).length;
                const pct = totC > 0 ? Math.round((okC / totC) * 100) : 0;
                contCursos.innerHTML += `
                    <div class="stat-curso-box">
                        <div class="stat-curso-header">
                            <span>${c.nombre} (${totC} resueltas)</span>
                            <span style="color: ${c.color};">${pct}% Precisión</span>
                        </div>
                        <div class="stat-progreso-bg"><div class="stat-progreso-fill" style="width: ${pct}%; background: ${c.color};"></div></div>
                    </div>
                `;
            });
        }

            tbody.innerHTML = '<tr><td colspan="6">Cargando...</td></tr>';
            const { data: alumnos, error } = await sb.from('perfiles').select('*').order('creado_en', { ascending: false });
            if (error || !alumnos || alumnos.length === 0) { tbody.innerHTML = '<tr><td colspan="6">No hay alumnos.</td></tr>'; return; }
            tbody.innerHTML = '';
            alumnos.forEach(a => {
                const esPrem = (a.plan === 'premium');
                const estaBloq = (a.estado === 'bloqueado');
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${a.prefijo_trato || ''} ${a.nombres || ''} ${a.apellidos || ''}</strong><br><small style="color: #666;">${a.carrera || 'Salud'}</small></td>
                        <td>${a.dni || 'Sin DNI'}</td><td>${a.correo}</td>
                        <td><span class="badge ${esPrem ? 'badge-prem' : 'badge-free'}">${esPrem ? 'PREMIUM' : 'GRATIS'}</span></td>
                        <td><span class="badge ${estaBloq ? 'badge-bloq' : 'badge-prem'}">${estaBloq ? 'BLOQUEADO' : 'ACTIVO'}</span></td>
                        <td style="display: flex; gap: 4px; flex-wrap: wrap;">
                            ${esPrem ? `<button class="btn-des" onclick="cambiarPlanAdmin('${a.id}', 'gratuito')">Bajar</button>` : `<button class="btn-act" onclick="cambiarPlanAdmin('${a.id}', 'premium')">Premium</button>`}
                            ${estaBloq ? `<button class="btn-act" onclick="cambiarEstadoCuenta('${a.id}', 'activo')">Desbloquear</button>` : `<button class="btn-bloq" onclick="cambiarEstadoCuenta('${a.id}', 'bloqueado')">Bloquear</button>`}
                            <button class="btn-clave" onclick="enviarClaveDesdeAdmin('${a.correo}')">Clave</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function cambiarPlanAdmin(userId, nuevoPlan) {
            const sb = obtenerSupabase();
            await sb.from('perfiles').update({ plan: nuevoPlan }).eq('id', userId);
            mostrarAvisoModal("Plan Actualizado", `Membresía cambiada a ${nuevoPlan.toUpperCase()} con éxito.`, "✔");
            if (user && user.id === userId) {
                await cargarPerfil();
                if (document.getElementById('sec-fijas').style.display === 'block') cargarLasFijasSERUMS();
                if (document.getElementById('sec-flashcards').style.display === 'block') cargarFlashcardsDesdeBD();
            }
            cargarAlumnosAdmin();
        }

        async function cambiarEstadoCuenta(userId, nuevoEstado) {
            const sb = obtenerSupabase();
            await sb.from('perfiles').update({ estado: nuevoEstado }).eq('id', userId);
            mostrarAvisoModal("Seguridad", `Cuenta actualizada.`, "🔒");
            cargarAlumnosAdmin();
        }

        async function enviarClaveDesdeAdmin(correoAlumno) {
            const sb = obtenerSupabase();
            try {
                const { error } = await sb.auth.resetPasswordForEmail(correoAlumno, { redirectTo: window.location.origin });
                if (error) throw error;
                mostrarAvisoModal("Enlace Generado", `Enviado a: ${correoAlumno}`, "📬");
            } catch (err) {
                mostrarAvisoModal("Error", err.message, "⚠️");
            }
        }

        async function salir() {
            const sb = obtenerSupabase();
            if (sb) await sb.auth.signOut();
            user = null; ver('vista-login');
        }
    </script>
</body>
</html>
